<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designa din ballmarker - CBT AB</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f4f4f4; padding: 15px; color: #333; margin: 0; }
        
        h1 { font-size: 20px; margin: 10px 0 5px 0; }
        .sub-header { font-size: 13px; color: #666; margin-bottom: 15px; }

        /* Sticky container för mobil */
        .preview-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(244, 244, 244, 0.95);
            padding: 10px 0;
            backdrop-filter: blur(5px);
        }

        #marker-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        #marker {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            border: 3px solid rgba(0,0,0,0.15);
            background-color: #ffd700;
            transition: background 0.3s;
            user-select: none; 
        }

        #margin-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6; 
            transition: border-width 0.1s ease;
        }

        #margin-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 0, 0, 0.7); 
            pointer-events: none; 
            z-index: 10; 
        }

        .corten { background: linear-gradient(135deg, #a0522d, #8b4513) !important; }
        .rostfritt { background: linear-gradient(135deg, #e0e0e0, #9e9e9e) !important; }
        .massing { background: linear-gradient(135deg, #ffd700, #b8860b) !important; }

        #uploaded-image {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 100%; height: auto;
            filter: grayscale(100%) contrast(200%);
            mix-blend-mode: multiply;
            opacity: 0.85;
            cursor: move;
            touch-action: none; 
            z-index: 5; 
        }

        #draggable-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px; font-weight: bold; color: #111;
            cursor: move; touch-action: none;
            z-index: 7; white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: none;
        }

        #edge-text-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 8; display: none;
        }

        /* Controls & Tab Navigation */
        .controls { 
            background: white; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            margin: 10px auto 0 auto; 
            max-width: 460px; 
            text-align: left; 
            width: 100%;
        }

        .tab-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
            background: #eee;
            padding: 4px;
            border-radius: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            background: transparent;
            color: #666;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: #0078d4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .control-group { margin-bottom: 12px; }
        .control-group label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; }

        select, input[type="file"], input[type="range"], input[type="text"], input[type="email"], textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 4px;
        }
        textarea { resize: vertical; height: 70px; }

        .btn { background: #28a745; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn:hover { background: #218838; }
        .btn:disabled { background: #6c757d; cursor: not-allowed; }

        .success-box { background: #d4edda; border-left: 4px solid #28a745; padding: 15px; font-size: 14px; color: #155724; border-radius: 4px; margin-top: 10px; display: none; line-height: 1.4; }

        /* Mobilanpassningar */
        @media (max-width: 600px) {
            #marker-container {
                width: 150px;
                height: 150px;
            }
            .tab-btn { font-size: 11px; padding: 8px 2px; }
        }
    </style>
</head>
<body>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <h1>Designa din Ballmarker</h1>
    <div class="sub-header">CBT AB - Välj material, text, färg & logga</div>

    <div class="preview-wrapper">
        <div id="marker-container">
            <div id="marker">
                <img id="uploaded-image" src="" alt="" style="display:none;">
                <div id="draggable-text"></div>
                
                <svg id="edge-text-svg" viewBox="0 0 200 200">
                    <path id="textPathTop" d="M 25,100 A 75,75 0 1,1 175,100" fill="none" />
                    <text font-weight="bold" fill="#111" text-anchor="middle" id="svgTextNode">
                        <textPath href="#textPathTop" startOffset="50%" id="edgeTextValue"></textPath>
                    </text>
                </svg>

                <div id="margin-mask"></div>
            </div>
            <div id="margin-line"></div>
        </div>
    </div>

    <div class="controls">
        <div class="tab-buttons">
            <button type="button" class="tab-btn active" onclick="switchTab('design')">1. Material & Bild</button>
            <button type="button" class="tab-btn" onclick="switchTab('text')">2. Text & Paintfill</button>
            <button type="button" class="tab-btn" onclick="switchTab('contact')">3. Skicka</button>
        </div>

        <form id="orderForm" 
              action="https://formsubmit.co/bilger.christian@gmail.com" 
              method="POST" 
              enctype="multipart/form-data" 
              target="hidden_iframe" 
              onsubmit="handleOrder(event)">
            
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            
            <input type="file" id="hiddenDesignFile" name="Designskiss" style="display:none;">
            <input type="file" id="hiddenOriginalFile" name="Original_Logga" style="display:none;">

            <div id="tab-design" class="tab-content active">
                <div class="control-group">
                    <label>Välj material:</label>
                    <select id="materialSelect" name="Material" onchange="changeMaterial()">
                        <option value="Massing (Guld)">Mässing (Guld)</option>
                        <option value="Rostfritt (Silver)">Rostfritt (Silver)</option>
                        <option value="Corten (Brunt/Rost)">Corten (Brunt/Rost)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Ladda upp logga/bild (valfritt):</label>
                    <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
                </div>

                <div class="control-group">
                    <label>Skala bild: <span id="scaleValue">100</span>%</label>
                    <input type="range" id="scaleRange" min="10" max="300" value="100" oninput="scaleImage(this.value)">
                </div>

                <div class="control-group">
                    <label>Marginal från kant: <span id="marginValue">5</span>%</label>
                    <input type="range" id="marginRange" min="0" max="35" value="5" oninput="updateMargin(this.value)">
                    <small style="color: #666; font-size: 11px;">Döljer element utanför den röda linjen.</small>
                </div>

                <button type="button" class="btn" style="background:#0078d4;" onclick="switchTab('text')">Vidare till Text & Paintfill ➔</button>
            </div>

            <div id="tab-text" class="tab-content">
                <div class="control-group" style="background: #fdf8e2; padding: 10px; border-radius: 6px; border: 1px solid #f9e79f;">
                    <label style="color: #b7950b;">Böjd text (längs kanten):</label>
                    <input type="text" id="edgeTextInput" name="Bojd_Text" placeholder="T.ex. KLUBBMÄSTARE 2026" oninput="updateTextContent()" style="background: white;">
                    
                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <div style="flex: 1;">
                            <select id="edgeFontSelect" onchange="updateTextStyles()" style="background: white; font-size: 11px;">
                                <option value="sans-serif">Modern</option>
                                <option value="Georgia, serif">Klassisk</option>
                                <option value="'Great Vibes', cursive">Handstil</option>
                                <option value="Impact, sans-serif">Block</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <select id="edgePaintSelect" onchange="updateTextStyles()" style="background: white; font-size: 11px;">
                                <option value="default">Standard gravyr</option>
                                <option value="#111111">⬛ Svart</option>
                                <option value="#d32f2f">🟥 Röd</option>
                                <option value="#ffffff">⬜ Vit</option>
                                <option value="#c0c0c0">◽ Silver</option>
                                <option value="#2e7d32">🟩 Grön</option>
                                <option value="#1565c0">🟦 Blå</option>
                            </select>
                        </div>
                        <div style="width: 70px;">
                            <input type="range" id="edgeTextSizeRange" min="10" max="24" value="14" oninput="updateTextStyles()">
                        </div>
                    </div>
                </div>

                <div class="control-group" style="background: #eef6fc; padding: 10px; border-radius: 6px; border: 1px solid #c7e0f4;">
                    <label style="color: #0078d4;">Mitten-text (flyttbar):</label>
                    <input type="text" id="freeTextInput" name="Mitten_Text" placeholder="T.ex. HOLE IN ONE" oninput="updateTextContent()" style="background: white;">
                    
                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <div style="flex: 1;">
                            <select id="freeFontSelect" onchange="updateTextStyles()" style="background: white; font-size: 11px;">
                                <option value="sans-serif">Modern</option>
                                <option value="Georgia, serif">Klassisk</option>
                                <option value="'Great Vibes', cursive">Handstil</option>
                                <option value="Impact, sans-serif">Block</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <select id="freePaintSelect" onchange="updateTextStyles()" style="background: white; font-size: 11px;">
                                <option value="default">Standard gravyr</option>
                                <option value="#111111">⬛ Svart</option>
                                <option value="#d32f2f">🟥 Röd</option>
                                <option value="#ffffff">⬜ Vit</option>
                                <option value="#c0c0c0">◽ Silver</option>
                                <option value="#2e7d32">🟩 Grön</option>
                                <option value="#1565c0">🟦 Blå</option>
                            </select>
                        </div>
                        <div style="width: 70px;">
                            <input type="range" id="freeTextSizeRange" min="10" max="32" value="16" oninput="updateTextStyles()">
                        </div>
                    </div>
                </div>

                <button type="button" class="btn" style="background:#0078d4;" onclick="switchTab('contact')">Vidare till Kontakt & Skicka ➔</button>
            </div>

            <div id="tab-contact" class="tab-content">
                <div class="control-group">
                    <label>Ditt Namn / Företag:</label>
                    <input type="text" id="namn" name="Namn" required placeholder="För- och efternamn">
                </div>

                <div class="control-group">
                    <label>Din E-post:</label>
                    <input type="email" id="epost" name="email" required placeholder="namn@exempel.se">
                </div>

                <div class="control-group">
                    <label>Meddelande / Antal:</label>
                    <textarea id="meddelande" name="Meddelande" placeholder="T.ex. Önskar förfrågan på 50 st..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn">Skicka förfrågan</button>
                
                <div id="successMsg" class="success-box">
                    <strong>Tack för din förfrågan!</strong><br>
                    Vi har tagit emot din design och återkommer till dig så snart som möjligt.
                </div>
            </div>

        </form>
    </div>

    <script>
        const img = document.getElementById('uploaded-image');
        const draggableText = document.getElementById('draggable-text');
        const edgeTextSvg = document.getElementById('edge-text-svg');
        const svgTextNode = document.getElementById('svgTextNode');
        const edgeTextValue = document.getElementById('edgeTextValue');
        const marginLine = document.getElementById('margin-line');
        const marginMask = document.getElementById('margin-mask');
        const marker = document.getElementById('marker');
        
        let savedImageData = null;
        let originalFile = null; 

        let isDraggingImg = false, imgXOffset = 0, imgYOffset = 0, imgInitX = 0, imgInitY = 0;
        let isDraggingText = false, textXOffset = 0, textYOffset = 0, textInitX = 0, textInitY = 0;

        window.onload = function() {
            updateMargin(5);
            updateTextStyles();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            
            const btns = document.querySelectorAll('.tab-btn');
            if (tabId === 'design') btns[0].classList.add('active');
            if (tabId === 'text') btns[1].classList.add('active');
            if (tabId === 'contact') btns[2].classList.add('active');
        }

        function getActualTextColor(paintVal) {
            if (paintVal && paintVal !== 'default') return paintVal;
            const mat = document.getElementById('materialSelect').value;
            if (mat.includes('Corten')) return '#555555';
            if (mat.includes('Rostfritt')) return '#1f1f1f';
            return '#4a3300';
        }

        function changeMaterial() {
            const val = document.getElementById('materialSelect').value;
            marker.className = '';
            if (val.includes('Corten')) marker.classList.add('corten');
            else if (val.includes('Rostfritt')) marker.classList.add('rostfritt');
            else marker.classList.add('massing');
            
            updateMargin(document.getElementById('marginRange').value);
            updateTextStyles();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                originalFile = file; 
                const reader = new FileReader();
                reader.onload = function(e) {
                    savedImageData = e.target.result;
                    img.src = savedImageData;
                    img.style.display = 'block';
                    resetImagePosition();
                }
                reader.readAsDataURL(file);
            }
        }

        function resetImagePosition() {
            document.getElementById('scaleRange').value = 100;
            document.getElementById('scaleValue').innerText = 100;
            img.style.width = '100%';
            imgXOffset = 0; imgYOffset = 0;
            updateImgTransform();
        }

        function scaleImage(val) {
            document.getElementById('scaleValue').innerText = val;
            img.style.width = val + '%';
            updateImgTransform();
        }

        function updateImgTransform() {
            img.style.transform = `translate(-50%, -50%) translate3d(${imgXOffset}px, ${imgYOffset}px, 0)`;
        }

        function updateTextStyles() {
            const freeSize = document.getElementById('freeTextSizeRange').value;
            const edgeSize = document.getElementById('edgeTextSizeRange').value;
            const freeFont = document.getElementById('freeFontSelect').value;
            const edgeFont = document.getElementById('edgeFontSelect').value;
            const edgePaint = document.getElementById('edgePaintSelect').value;
            const freePaint = document.getElementById('freePaintSelect').value;

            draggableText.style.fontSize = freeSize + 'px';
            draggableText.style.fontFamily = freeFont;
            draggableText.style.color = getActualTextColor(freePaint);

            svgTextNode.setAttribute('font-size', edgeSize);
